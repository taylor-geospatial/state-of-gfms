<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster thumbnail</title>
<!-- Source for thumbnail.png (320 x 256, the NeurIPS paper thumbnail). Rendered by scripts/export_poster.py. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@500;600&family=Open+Sans:wght@600;700&display=swap">
<style>
  :root { --brown: #3B1E1C; --ivory: #F4F4EB; --peri: #80A0D8; --lblue: #A7D0DC; --red: #FF4F2C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 320px; height: 256px; overflow: hidden; padding: 17px 18px 14px; display: flex; flex-direction: column;
    background: radial-gradient(ellipse 70% 50% at 100% 0%, rgba(128,160,216,.22), transparent 70%), var(--brown);
    color: var(--ivory); font-family: "Open Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .kicker { font: 600 10px/1 "Inconsolata", monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lblue);
    display: flex; align-items: center; gap: 6px; }
  .kicker::before { content: ""; width: 7px; height: 7px; background: var(--peri); }
  .hook { margin: 9px 0 0; font-size: 28px; line-height: 0.98; letter-spacing: -0.045em; font-weight: 700; }
  .hook em { font-style: normal; color: var(--red); }
  .rows { margin-top: auto; }
  .row { display: grid; grid-template-columns: 100px 1fr 30px; align-items: center; height: 19px; padding: 0 4px; border-radius: 3px; }
  .row.on { background: rgba(244,244,235,.14); }
  .name { font-size: 10px; font-weight: 600; white-space: nowrap; }
  .name span { color: var(--lblue); }
  .track { position: relative; height: 100%; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(244,244,235,.24); }
  .gap { position: absolute; top: 50%; height: 3px; margin-top: -1.5px; background: rgba(244,244,235,.5); border-radius: 2px; }
  .dot { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 1.5px solid var(--brown); }
  .lo { background: var(--ivory); } .hi { background: var(--red); }
  .delta { font: 600 11px "Inconsolata", monospace; text-align: right; }
</style>
</head>
<body>
  <p class="kicker">NeurIPS 2026 · Position Paper</p>
  <p class="hook"><em>Nobody knows</em> which geospatial foundation model is best.</p>
  <div class="rows" id="rows"></div>
<script>
  // Same model, benchmark, and protocol; lowest vs highest score across papers (subset of the poster chart).
  const ROWS = [["GPT-4o", "UCMerced", 43.5, 88.8], ["CROMA", "m-Cashew", 30.1, 62.2], ["ViT-22k", "OSCD", 22.5, 52.4], ["DOFA", "m-Cashew", 27.7, 53.9]];
  document.getElementById("rows").innerHTML = ROWS.map(([m, b, lo, hi], i) =>
    `<div class="row${i === 1 ? " on" : ""}"><div class="name">${m} <span>${b}</span></div><div class="track"><i class="gap" style="left:${lo}%;width:${hi - lo}%"></i><i class="dot lo" style="left:${lo}%"></i><i class="dot hi" style="left:${hi}%"></i></div><div class="delta">Δ${Math.round(hi - lo)}</div></div>`
  ).join("");
</script>
</body>
</html>
